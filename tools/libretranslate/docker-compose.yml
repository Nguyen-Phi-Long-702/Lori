   # Tam thoi chay tren may Dev de dev/test; noi chay co dinh chua chot (xem INFRA.md muc 12).
services:
  libretranslate:
    container_name: libretranslate
    image: libretranslate/libretranslate:latest
    ports:
      - "5000:5000"
    environment:
      # Chi nap tieng Anh + tieng Viet de nhe va khoi dong nhanh
      - LT_LOAD_ONLY=en,vi
    volumes:
      # Giu model trong volume de lan sau khong phai tai lai
      - libretranslate_models:/home/libretranslate/.local:rw

volumes:
  libretranslate_models: