spring.application.name=lori-backend

# Render va cac nen tang cloud truyen cong qua bien moi truong PORT; chay local mac dinh 8080
server.port=${PORT:8080}

# /actuator/health chi hien trang thai tung thanh phan (db, redis), khong lo chi tiet
management.endpoint.health.show-components=always

# ===== PostgreSQL (Neon) =====
# NEON_URL: chuoi JDBC dang direct (host khong co -pooler), vi du jdbc:postgresql://<host>/lori_db?sslmode=require
# NEON_USER, NEON_PASSWORD: user rieng cua app (lori_app, khong phai superuser)
spring.datasource.url=${NEON_URL}
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}

# ===== Pool ket noi (HikariCP) =====
# Neon Free tu ngu sau 5 phut va gioi han CU-gio (INFRA.md). Hikari mac dinh giu san 10 ket noi
# va tu tao ket noi moi dinh ky, co the danh thuc Neon lien tuc. minimum-idle=0: chi mo ket noi khi co request.
spring.datasource.hikari.minimum-idle=0

# ===== JPA =====
# Schema do Flyway quan ly (src/main/resources/db/migration); Hibernate chi kiem tra, khong tu tao/sua bang
spring.jpa.hibernate.ddl-auto=validate