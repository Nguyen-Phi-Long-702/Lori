spring.application.name=lori-backend

# Render va cac nen tang cloud truyen cong qua bien moi truong PORT; chay local mac dinh 8080
server.port=${PORT:8080}

# /actuator/health chi hien trang thai tung thanh phan (db, redis), khong lo chi tiet
management.endpoint.health.show-components=always

# ===== PostgreSQL (Neon) =====
# NEON_URL: chuoi JDBC dang direct (host khong co -pooler), vi du jdbc:postgresql://<host>/lori_db?sslmode=require
# NEON_USER, NEON_PASSWORD: user rieng cua app (lori_app, khong phai superuser)
spring.datasource.url=${NEON_URL}
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}

# ===== Pool ket noi (HikariCP) =====
# Neon Free tu ngu sau 5 phut va gioi han CU-gio (INFRA.md). Hikari mac dinh giu san 10 ket noi
# va tu tao ket noi moi dinh ky, co the danh thuc Neon lien tuc. minimum-idle=0: chi mo ket noi khi co request.
spring.datasource.hikari.minimum-idle=0

# ===== JPA =====
# Schema do Flyway quan ly (src/main/resources/db/migration); Hibernate chi kiem tra, khong tu tao/sua bang
spring.jpa.hibernate.ddl-auto=validate

# ===== JWT =====
# JWT_SECRET: chuoi ngau nhien >= 32 byte (256-bit), truyen qua bien moi truong, khong commit
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=lori-api
app.jwt.audience=lori-android
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# ===== Anti-abuse =====
# X-API-Key / X-App-Signature chi la lop loc bo sung, khong phai ranh gioi bao mat that (ke hoach muc 8.0)
app.security.api-key=${API_KEY}
app.security.app-signature=${APP_SIGNATURE}

# ===== Google Sign-In =====
# GOOGLE_CLIENT_ID: Web client ID tao tren Google Cloud Console; ID Token hop le phai co aud = gia tri nay
app.google.client-id=${GOOGLE_CLIENT_ID}

# ===== Gui email qua Brevo HTTPS API (Render Free chan cong SMTP) =====
# BREVO_API_KEY: API key v3 tao tren Brevo; MAIL_SENDER_EMAIL: email nguoi gui DA XAC MINH tren Brevo
app.mail.brevo-api-key=${BREVO_API_KEY}
app.mail.sender-email=${MAIL_SENDER_EMAIL}
app.mail.sender-name=Lori

# ===== Dich thuat (LibreTranslate, EN-VI) =====
# LIBRETRANSLATE_URL: dia chi goc cua LibreTranslate, KHONG co dau / o cuoi. Khong dat thi dung http://localhost:5000.
# Khi LibreTranslate khong chay hoac khong toi duoc, POST /api/translate tra 503; Backend van khoi dong binh thuong.
app.translate.base-url=${LIBRETRANSLATE_URL:http://localhost:5000}

# ===== Thanh toan mock =====
# PAYMENT_MOCK_ENABLED=false -> POST /api/payment/mock-purchase tra 403. Mac dinh bat (moi truong demo).
app.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:true}

# ===== Het han Premium =====
# Lich chay SubscriptionExpiryScheduler. Mac dinh: dau moi gio.
# Co the doi bang bien SUBSCRIPTION_EXPIRY_CRON (vi du de test: moi phut mot lan).
app.subscription.expiry-cron=${SUBSCRIPTION_EXPIRY_CRON:0 0 * * * *}